<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="eBay計算">
<title>eBay利益計算</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #4f8ef7;
    --accent2: #38d9a9;
    --danger: #ff6b6b;
    --text: #e8eaf0;
    --text2: #8892a4;
    --border: #2d3348;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    padding: 8px;
    padding-bottom: 30px;
    max-width: 480px;
    margin: 0 auto;
  }

  .page-header {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }

  h1 { font-size: 17px; font-weight: 600; }
  .ttm { font-size: 12px; color: var(--accent2); margin-top: 2px; }

  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }
  .tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--text2); }
  .tab.active { background: var(--accent); color: #fff; font-weight: 600; }

  .panel { display: none; }
  .panel.show { display: block; }

  .card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; border: 1px solid var(--border); }
  .card-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }

  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }

  .input-wrap { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .input-wrap:focus-within { border-color: var(--accent); }

  .unit { padding: 0 10px; color: var(--text2); font-size: 13px; background: var(--surface); border-right: 1px solid var(--border); height: 44px; display: flex; align-items: center; min-width: 36px; justify-content: center; }
  .unit.right { border-right: none; border-left: 1px solid var(--border); }

  input[type="text"], input[type="number"] { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; padding: 0 12px; height: 44px; outline: none; width: 100%; -webkit-appearance: none; }

  .sku-wrap { display: flex; gap: 8px; }
  .sku-wrap .input-wrap { flex: 1; }

  .btn-search { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; font-weight: 600; cursor: pointer; height: 44px; white-space: nowrap; }

  .item-name { font-size: 12px; color: var(--accent2); margin-top: 6px; min-height: 16px; }

  .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .platform-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .cat-btn, .plat-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 12px; color: var(--text2); cursor: pointer; }
  .plat-btn { padding: 10px 4px; font-size: 13px; }
  .cat-btn.active, .plat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .result-card { background: var(--surface2); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; border: 1px solid var(--border); display: none; }
  .result-card.show { display: block; }

  .result-main { text-align: center; margin-bottom: 14px; }
  .result-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .result-value { font-size: 34px; font-weight: 700; letter-spacing: -1px; }
  .result-value.positive { color: var(--accent2); }
  .result-value.negative { color: var(--danger); }
  .result-rate { font-size: 15px; font-weight: 600; margin-top: 4px; }

  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .result-item { background: var(--surface); border-radius: 8px; padding: 10px 12px; }
  .result-item-label { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
  .result-item-value { font-size: 15px; font-weight: 600; }

  .breakeven { background: var(--surface); border-radius: 8px; padding: 12px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
  .breakeven-label { font-size: 12px; color: var(--text2); }
  .breakeven-value { font-size: 16px; font-weight: 700; color: var(--accent); }

  .btn-calc { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; }
</style>
</head>
<body>

  <div class="page-header">
    <h1 id="pageTitle">eBay 利益計算</h1>
    <div class="ttm" id="ttmDisplay">TTMレートを取得中...</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('normal')">通常計算</div>
    <div class="tab" onclick="switchTab('domestic')">国内</div>
  </div>

  <!-- 共通：SKU検索・仕入値 -->
  <div class="card">
    <div class="card-title">SKU検索</div>
    <div class="sku-wrap">
      <div class="input-wrap">
        <input type="text" id="skuInput" placeholder="例：WB790" style="text-transform:uppercase">
      </div>
      <button class="btn-search" onclick="searchSku()" type="button">取得</button>
    </div>
    <div class="item-name" id="itemName"></div>
  </div>

  <div class="card">
    <div class="card-title">仕入</div>
    <div class="field">
      <label>仕入値</label>
      <div class="input-wrap"><div class="unit">¥</div><input type="number" id="cost" placeholder="0" inputmode="numeric"></div>
    </div>
  </div>

  <!-- ===================== eBay（通常計算） ===================== -->
  <div class="panel show" id="panel-normal">
    <div class="card">
      <div class="card-title">カテゴリー</div>
      <div class="category-grid">
        <div class="cat-btn" onclick="setCategory(this, 15.0)">カメラ</div>
        <div class="cat-btn active" onclick="setCategory(this, 15.0)">腕時計</div>
        <div class="cat-btn" onclick="setCategory(this, 15.0)">楽器</div>
        <div class="cat-btn" onclick="setCategory(this, 15.0)">ゲーム</div>
        <div class="cat-btn" onclick="setCategory(this, 15.0)">おもちゃ</div>
        <div class="cat-btn" onclick="setCategory(this, 15.0)">ブランド品</div>
        <div class="cat-btn" onclick="setCategory(this, 15.0)">その他</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">基本情報</div>
      <div class="field">
        <label>販売価格 商品代（USD）</label>
        <div class="input-wrap"><div class="unit">$</div><input type="number" id="price" placeholder="0.00" inputmode="decimal" step="0.01"></div>
      </div>
      <div class="field">
        <label>販売価格 送料（USD）</label>
        <div class="input-wrap"><div class="unit">$</div><input type="number" id="shippingUsd" placeholder="0.00" inputmode="decimal" step="0.01"></div>
      </div>
      <div class="field">
        <label>送料コスト（円）</label>
        <div class="input-wrap"><div class="unit">¥</div><input type="number" id="shippingJpy" value="1500" inputmode="numeric"></div>
      </div>
      <div class="field">
        <label>割引（USD）</label>
        <div class="input-wrap"><div class="unit">$</div><input type="number" id="discount" placeholder="0.00" inputmode="decimal" step="0.01"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">手数料・経費</div>
      <div class="field">
        <label>eBay手数料</label>
        <div class="input-wrap"><input type="number" id="ebayFee" value="15.0" inputmode="decimal" step="0.01"><div class="unit right">%</div></div>
      </div>
      <div class="field">
        <label>Payoneer手数料</label>
        <div class="input-wrap"><input type="number" id="payoneerFee" value="2.0" inputmode="decimal" step="0.01"><div class="unit right">%</div></div>
      </div>
      <div class="field">
        <label>外注費</label>
        <div class="input-wrap"><div class="unit">¥</div><input type="number" id="outsource" placeholder="0" inputmode="numeric"></div>
      </div>
      <div class="field">
        <label>諸経費率（仕入値の）</label>
        <div class="input-wrap"><input type="number" id="miscRate" value="0" inputmode="decimal" step="0.1"><div class="unit right">%</div></div>
      </div>
      <div class="field">
        <label>関税（商品代の）</label>
        <div class="input-wrap"><input type="number" id="customsRate" value="12.5" inputmode="decimal" step="0.1"><div class="unit right">%</div></div>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-main">
        <div class="result-label">利益</div>
        <div class="result-value" id="resultValue">¥0</div>
        <div class="result-rate" id="resultRate">利益率 0%</div>
      </div>
      <div class="result-grid">
        <div class="result-item"><div class="result-item-label">売上（円換算）</div><div class="result-item-value" id="resSales">¥0</div></div>
        <div class="result-item"><div class="result-item-label">手数料合計</div><div class="result-item-value" id="resFee">¥0</div></div>
        <div class="result-item"><div class="result-item-label">送料コスト</div><div class="result-item-value" id="resShipping">¥0</div></div>
        <div class="result-item"><div class="result-item-label">仕入値</div><div class="result-item-value" id="resCost">¥0</div></div>
      </div>
      <div class="breakeven">
        <div class="breakeven-label">損益分岐点</div>
        <div class="breakeven-value" id="resBreakeven">$0.00</div>
      </div>
    </div>
  </div>

  <!-- ===================== 国内 ===================== -->
  <div class="panel" id="panel-domestic">
    <div class="card">
      <div class="card-title">販売先</div>
      <div class="platform-grid">
        <div class="plat-btn active" data-fee="10" onclick="setPlatform(this)">メルカリ</div>
        <div class="plat-btn" data-fee="10" onclick="setPlatform(this)">ヤフオク</div>
        <div class="plat-btn" data-fee="5" onclick="setPlatform(this)">Yahoo!フリマ</div>
        <div class="plat-btn" data-fee="0" onclick="setPlatform(this, true)">その他（手入力）</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">基本情報</div>
      <div class="field">
        <label>販売価格（円）</label>
        <div class="input-wrap"><div class="unit">¥</div><input type="number" id="d_price" placeholder="0" inputmode="numeric"></div>
      </div>
      <div class="field">
        <label>送料コスト（円・自己負担分）</label>
        <div class="input-wrap"><div class="unit">¥</div><input type="number" id="d_shippingJpy" value="800" inputmode="numeric"></div>
      </div>
      <div class="field">
        <label>値引き（円）</label>
        <div class="input-wrap"><div class="unit">¥</div><input type="number" id="d_discount" placeholder="0" inputmode="numeric"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">手数料・経費</div>
      <div class="field">
        <label>販売手数料（販売価格−値引きに対して）</label>
        <div class="input-wrap"><input type="number" id="d_fee" value="10" inputmode="decimal" step="0.01"><div class="unit right">%</div></div>
      </div>
      <div class="field">
        <label>外注費</label>
        <div class="input-wrap"><div class="unit">¥</div><input type="number" id="d_outsource" placeholder="0" inputmode="numeric"></div>
      </div>
      <div class="field">
        <label>諸経費率（仕入値の）</label>
        <div class="input-wrap"><input type="number" id="d_miscRate" value="0" inputmode="decimal" step="0.1"><div class="unit right">%</div></div>
      </div>
    </div>

    <div class="result-card" id="d_resultCard">
      <div class="result-main">
        <div class="result-label">利益</div>
        <div class="result-value" id="d_resultValue">¥0</div>
        <div class="result-rate" id="d_resultRate">利益率 0%</div>
      </div>
      <div class="result-grid">
        <div class="result-item"><div class="result-item-label">売上</div><div class="result-item-value" id="d_resSales">¥0</div></div>
        <div class="result-item"><div class="result-item-label">手数料合計</div><div class="result-item-value" id="d_resFee">¥0</div></div>
        <div class="result-item"><div class="result-item-label">送料コスト</div><div class="result-item-value" id="d_resShipping">¥0</div></div>
        <div class="result-item"><div class="result-item-label">仕入値</div><div class="result-item-value" id="d_resCost">¥0</div></div>
      </div>
      <div class="breakeven">
        <div class="breakeven-label">損益分岐点（販売価格）</div>
        <div class="breakeven-value" id="d_resBreakeven">¥0</div>
      </div>
    </div>
  </div>

  <button class="btn-calc" onclick="calculate()" type="button">計算する</button>

<script>
  var GAS_API_URL = '/api/proxy';

  var ttmRate = 150;
  var currentMode = 'normal';

  function $(id) { return document.getElementById(id); }
  function num(id) { return parseFloat($(id).value) || 0; }

  window.onload = function() {
    loadSettings();
    fetchTTM();
  };

  function fetchTTM() {
    fetch(GAS_API_URL + '?action=ttm')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.rate && data.rate > 0) {
          ttmRate = data.rate;
          $('ttmDisplay').textContent = 'TTM: ¥' + data.rate.toFixed(2) + ' / USD';
        } else {
          $('ttmDisplay').textContent = 'TTM取得失敗';
        }
      })
      .catch(function() {
        $('ttmDisplay').textContent = 'TTM取得失敗';
      });
  }

  function searchSku() {
    var sku = $('skuInput').value.trim();
    if (!sku) return;
    $('itemName').textContent = '検索中...';
    fetch(GAS_API_URL + '?action=sku&sku=' + encodeURIComponent(sku))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.found) {
          $('cost').value = data.cost;
          $('itemName').textContent = data.itemName;
        } else {
          $('itemName').textContent = '⚠️ SKUが見つかりません';
        }
      })
      .catch(function() {
        $('itemName').textContent = 'エラーが発生しました';
      });
  }

  function switchTab(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab').forEach(function(t, i) {
      t.classList.toggle('active', (i === 0 && mode === 'normal') || (i === 1 && mode === 'domestic'));
    });
    $('panel-normal').classList.toggle('show', mode === 'normal');
    $('panel-domestic').classList.toggle('show', mode === 'domestic');
    $('pageTitle').textContent = mode === 'normal' ? 'eBay 利益計算' : '国内 利益計算';
    $('ttmDisplay').style.display = mode === 'normal' ? '' : 'none';
  }

  function setCategory(el, rate) {
    document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
    el.classList.add('active');
    $('ebayFee').value = rate;
    saveSettings();
  }

  function setPlatform(el, manual) {
    document.querySelectorAll('.plat-btn').forEach(function(b) { b.classList.remove('active'); });
    el.classList.add('active');
    if (!manual) $('d_fee').value = el.getAttribute('data-fee');
    saveSettings();
  }

  function calculate() {
    if (currentMode === 'domestic') { calculateDomestic(); } else { calculateEbay(); }
    saveSettings();
  }

  // ---------- eBay（従来どおり） ----------
  function calculateEbay() {
    var cost        = num('cost');
    var price       = num('price');
    var shippingUsd = num('shippingUsd');
    var shippingJpy = num('shippingJpy');
    var discount    = num('discount');
    var ebayFee     = num('ebayFee');
    var payoneerFee = num('payoneerFee');
    var outsource   = num('outsource');
    var miscRate    = num('miscRate');
    var customsRate = num('customsRate');

    var totalUsd       = price + shippingUsd - discount;
    var sales          = totalUsd * ttmRate;
    var ebayFeeAmt     = (price + shippingUsd) * (ebayFee / 100) * ttmRate;
    var payoneerFeeAmt = totalUsd * (payoneerFee / 100) * ttmRate;
    var customsAmt     = price * (customsRate / 100) * ttmRate;
    var miscAmt        = cost * (miscRate / 100);
    var totalFee       = ebayFeeAmt + payoneerFeeAmt + customsAmt + miscAmt + outsource;
    var profit         = sales - cost - shippingJpy - totalFee;
    var profitRate     = sales > 0 ? (profit / sales * 100) : 0;
    var feeRate        = (ebayFee + payoneerFee + customsRate) / 100;
    var fixedCost      = cost + shippingJpy + miscAmt + outsource;
    var breakeven      = fixedCost / (ttmRate * (1 - feeRate));

    var card = $('resultCard');
    card.classList.add('show');
    var val = $('resultValue');
    val.textContent = '¥' + Math.round(profit).toLocaleString();
    val.className   = 'result-value ' + (profit >= 0 ? 'positive' : 'negative');
    $('resultRate').textContent   = '利益率 ' + profitRate.toFixed(1) + '%';
    $('resSales').textContent     = '¥' + Math.round(sales).toLocaleString();
    $('resFee').textContent       = '¥' + Math.round(totalFee).toLocaleString();
    $('resShipping').textContent  = '¥' + Math.round(shippingJpy).toLocaleString();
    $('resCost').textContent      = '¥' + Math.round(cost).toLocaleString();
    $('resBreakeven').textContent = '$' + breakeven.toFixed(2);
  }

  // ---------- 国内 ----------
  function calculateDomestic() {
    var cost        = num('cost');
    var price       = num('d_price');
    var shippingJpy = num('d_shippingJpy');
    var discount    = num('d_discount');
    var feePct      = num('d_fee');
    var outsource   = num('d_outsource');
    var miscRate    = num('d_miscRate');

    var sales      = Math.max(price - discount, 0);
    var feeAmt     = sales * (feePct / 100);
    var miscAmt    = cost * (miscRate / 100);
    var totalFee   = feeAmt + miscAmt + outsource;
    var profit     = sales - cost - shippingJpy - totalFee;
    var profitRate = sales > 0 ? (profit / sales * 100) : 0;

    // 損益分岐点：値引きなしで利益0になる販売価格
    var fixedCost  = cost + shippingJpy + miscAmt + outsource;
    var breakeven  = feePct < 100 ? fixedCost / (1 - feePct / 100) : 0;

    $('d_resultCard').classList.add('show');
    var val = $('d_resultValue');
    val.textContent = '¥' + Math.round(profit).toLocaleString();
    val.className   = 'result-value ' + (profit >= 0 ? 'positive' : 'negative');
    $('d_resultRate').textContent   = '利益率 ' + profitRate.toFixed(1) + '%';
    $('d_resSales').textContent     = '¥' + Math.round(sales).toLocaleString();
    $('d_resFee').textContent       = '¥' + Math.round(totalFee).toLocaleString();
    $('d_resShipping').textContent  = '¥' + Math.round(shippingJpy).toLocaleString();
    $('d_resCost').textContent      = '¥' + Math.round(cost).toLocaleString();
    $('d_resBreakeven').textContent = '¥' + Math.ceil(breakeven).toLocaleString();
  }

  // ---------- 設定の保存 ----------
  function saveSettings() {
    try {
      localStorage.setItem('ebayCalcSettings', JSON.stringify({
        ebayFee:     $('ebayFee').value,
        payoneerFee: $('payoneerFee').value,
        miscRate:    $('miscRate').value,
        customsRate: $('customsRate').value,
        outsource:   $('outsource').value,
        shippingJpy: $('shippingJpy').value
      }));
      var btns = document.querySelectorAll('.plat-btn');
      var idx = Array.prototype.indexOf.call(btns, document.querySelector('.plat-btn.active'));
      localStorage.setItem('domesticCalcSettings', JSON.stringify({
        platformIdx: idx,
        fee:         $('d_fee').value,
        miscRate:    $('d_miscRate').value,
        outsource:   $('d_outsource').value,
        shippingJpy: $('d_shippingJpy').value
      }));
    } catch(e) {}
  }

  function loadSettings() {
    try {
      var s = JSON.parse(localStorage.getItem('ebayCalcSettings') || '{}');
      if (s.ebayFee)     $('ebayFee').value     = s.ebayFee;
      if (s.payoneerFee) $('payoneerFee').value = s.payoneerFee;
      if (s.miscRate)    $('miscRate').value    = s.miscRate;
      if (s.customsRate) $('customsRate').value = s.customsRate;
      if (s.outsource)   $('outsource').value   = s.outsource;
      if (s.shippingJpy) $('shippingJpy').value = s.shippingJpy;
    } catch(e) {}
    try {
      var d = JSON.parse(localStorage.getItem('domesticCalcSettings') || '{}');
      if (typeof d.platformIdx === 'number' && d.platformIdx >= 0) {
        var btns = document.querySelectorAll('.plat-btn');
        btns.forEach(function(b) { b.classList.remove('active'); });
        if (btns[d.platformIdx]) btns[d.platformIdx].classList.add('active');
      }
      if (d.fee !== undefined && d.fee !== '') $('d_fee').value = d.fee;
      if (d.miscRate)    $('d_miscRate').value    = d.miscRate;
      if (d.outsource)   $('d_outsource').value   = d.outsource;
      if (d.shippingJpy) $('d_shippingJpy').value = d.shippingJpy;
    } catch(e) {}
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); calculate(); }
  });
</script>
</body>
</html>
